[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "growth-automation-toolkit"
version = "1.0.0"
authors = [
  { name = "jloa-dev", email = "jloa.dev@gmail.com" },
]
description = "High-performance B2B lead generation, SEO auditing, and workflow automation toolkit."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0",
]

[project.scripts]
leadpulse = "src.leadpulse.cli:main"
